name: Paper Trading Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one paper trading cycle
        run: python paper_trade.py --symbol BTC/USDT --timeframe 15m --balance 1000

      - name: Commit updated state and log
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json data/trade_log.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update paper trading state [skip ci]"
          git push
